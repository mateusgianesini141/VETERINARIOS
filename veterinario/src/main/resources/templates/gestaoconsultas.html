<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Clínica Vet Amigos - Gestão de Consultas</title>

<style>

body{
    font-family: Arial, sans-serif;
    margin: 20px;
}

h1{
    color: #2c3e50;
}

table{
    width:100%;
    border-collapse: collapse;
    margin-top:20px;
}

table, th, td{
    border:1px solid #ccc;
}

th{
    background-color:#f2f2f2;
}

th, td{
    padding:10px;
    text-align:center;
}

input, select, textarea{
    width:100%;
    padding:8px;
    margin-top:5px;
    margin-bottom:10px;
}

.formulario{
    border:1px solid #ccc;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
}

.btn{
    padding:8px 15px;
    border:none;
    cursor:pointer;
    border-radius:5px;
}

.salvar{
    background-color:green;
    color:white;
}

.editar{
    background-color:orange;
    color:white;
}

.excluir{
    background-color:red;
    color:white;
}

.novo{
    background-color:blue;
    color:white;
}

.entrada{
    color:green;
    font-weight:bold;
}

.saida{
    color:red;
    font-weight:bold;
}

</style>

</head>
<body>

<h1>🐾 Clínica Vet Amigos - Gestão de Consultas</h1>

<a href="/principal">
    <button class="btn novo">Página Inicial</button>
</a>

<hr>

<div th:if="${mensagem}" style="color:green;">
    <p th:text="${mensagem}"></p>
</div>

<div th:if="${erro}" style="color:red;">
    <p th:text="${erro}"></p>
</div>

<div class="formulario">

<h2>Nova Consulta</h2>

<form th:action="@{/consultas/salvar}"
      th:object="${consulta}"
      method="post">

    <input type="hidden" th:field="*{id}">

    <label>Nome do Animal:</label>
    <input type="text"
           th:field="*{nomeAnimal}"
           required>

    <label>Nome do Tutor:</label>
    <input type="text"
           th:field="*{nomeTutor}"
           required>

    <label>Veterinário:</label>
    <input type="text"
           th:field="*{veterinario}"
           required>

    <label>Tipo da Consulta:</label>
    <select th:field="*{tipoConsulta}">
        <option value="">Selecione...</option>
        <option value="CONSULTA">Consulta</option>
        <option value="VACINACAO">Vacinação</option>
        <option value="RETORNO">Retorno</option>
        <option value="CIRURGIA">Cirurgia</option>
        <option value="EXAME">Exame</option>
    </select>

    <label>Movimentação:</label>
    <select th:field="*{movimentacao}">
        <option value="">Selecione...</option>
        <option value="ENTRADA">Entrada</option>
        <option value="SAIDA">Saída</option>
    </select>

    <label>Data:</label>
    <input type="date"
           th:field="*{data}"
           required>

    <label>Horário:</label>
    <input type="time"
           th:field="*{horario}"
           required>

    <label>Observações:</label>
    <textarea th:field="*{observacoes}"
              rows="4"></textarea>

    <button type="submit" class="btn salvar">
        Salvar Consulta
    </button>

</form>

</div>

<hr>

<h2>Lista de Consultas</h2>

<table>

<thead>
<tr>
    <th>ID</th>
    <th>Animal</th>
    <th>Tutor</th>
    <th>Veterinário</th>
    <th>Tipo</th>
    <th>Entrada/Saída</th>
    <th>Data</th>
    <th>Horário</th>
    <th>Observações</th>
    <th>Ações</th>
</tr>
</thead>

<tbody>

<tr th:each="consulta : ${consultas}">

    <td th:text="${consulta.id}"></td>

    <td th:text="${consulta.nomeAnimal}"></td>

    <td th:text="${consulta.nomeTutor}"></td>

    <td th:text="${consulta.veterinario}"></td>

    <td th:text="${consulta.tipoConsulta}"></td>

    <td>

        <span th:if="${consulta.movimentacao == 'ENTRADA'}"
              class="entrada">
            ENTRADA
        </span>

        <span th:if="${consulta.movimentacao == 'SAIDA'}"
              class="saida">
            SAÍDA
        </span>

    </td>

    <td th:text="${consulta.data}"></td>

    <td th:text="${consulta.horario}"></td>

    <td th:text="${consulta.observacoes}"></td>

    <td>

        <a th:href="@{/consultas/editar/{id}(id=${consulta.id})}">
            <button type="button" class="btn editar">
                Editar
            </button>
        </a>

        <a th:href="@{/consultas/excluir/{id}(id=${consulta.id})}"
           onclick="return confirm('Deseja excluir esta consulta?')">

            <button type="button" class="btn excluir">
                Excluir
            </button>

        </a>

    </td>

</tr>

<tr th:if="${#lists.isEmpty(consultas)}">
    <td colspan="10">
        Nenhuma consulta cadastrada.
    </td>
</tr>

</tbody>

</table>

</body>
</html>
